name: Nightly Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Validate Nightly Quality coverage
        shell: pwsh
        run: ./scripts/ci/validate-nightly-quality.ps1

  go-security:
    name: Go Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec
        run: |
          "$(go env GOPATH)/bin/gosec" -conf .gosec.json ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend-security:
    name: Frontend Security (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Mini App
            path: web/miniapp
            lockfile: web/miniapp/package-lock.json
          - app: Admin
            path: web/admin
            lockfile: web/admin/package-lock.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Validate lockfile integrity
        run: node scripts/ci/validate-npm-lockfiles.mjs "${{ matrix.lockfile }}"

      - name: Install dependencies
        run: npm --prefix "${{ matrix.path }}" ci

      - name: Audit dependencies
        run: npm --prefix "${{ matrix.path }}" audit --audit-level=moderate

  k6-smoke-load:
    name: k6 Smoke/Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate k6 scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f \( -path "./k6/*.js" -o -path "./tests/k6/*.js" -o -path "./load-tests/*.js" \) | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "Expected at least one k6 script."
            exit 1
          fi

          for script in "${scripts[@]}"; do
            echo "Inspecting k6: ${script}"
            docker run --rm \
              --network none \
              -v "${PWD}:/src:ro" \
              -w /src \
              grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669 inspect "${script#./}"
          done

  trivy-filesystem:
    name: Trivy Filesystem/Misconfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Trivy
        shell: bash
        run: bash scripts/ci/install-trivy.sh

      - name: Scan repository filesystem and configuration
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --no-progress \
            .
        timeout-minutes: 15

  trivy-images:
    name: Trivy Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
          - service: provider-webhook
            dockerfile: Dockerfile.provider-webhook
          - service: provider-balance-bot
            dockerfile: Dockerfile.provider-balance-bot
          - service: miniapp
            dockerfile: Dockerfile.miniapp
          - service: migrate
            dockerfile: Dockerfile.migrate
          - service: backup
            dockerfile: Dockerfile.backup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert expected Dockerfile exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "Expected production Dockerfile is missing: ${{ matrix.dockerfile }}"
            exit 1
          fi

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="nightly/${{ matrix.service }}:${GITHUB_SHA}"
          docker build --file "${{ matrix.dockerfile }}" --tag "${image_ref}" .

      - name: Install pinned Trivy
        shell: bash
        run: bash scripts/ci/install-trivy.sh

      - name: Scan image
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --no-progress \
            "nightly/${{ matrix.service }}:${GITHUB_SHA}"
        timeout-minutes: 15
