name: Deploy DEV

on:
  workflow_run:
    workflows:
      - Docker Images
    types:
      - completed
    branches:
      - dev-deploy
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  validate_source:
    name: Validate DEV source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev-deploy-only rollout
        shell: bash
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${GITHUB_REF}" != "refs/heads/dev-deploy" ]]; then
                echo "Manual DEV deploy must be dispatched from refs/heads/dev-deploy." >&2
                exit 1
              fi
              ;;
            workflow_run)
              if [[ "${WORKFLOW_RUN_CONCLUSION}" != "success" || "${WORKFLOW_RUN_EVENT}" != "push" || "${WORKFLOW_RUN_HEAD_BRANCH}" != "dev-deploy" ]]; then
                echo "DEV deploy requires a successful Docker Images push from dev-deploy." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported DEV deploy event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy DEV VPS
    runs-on: ubuntu-latest
    environment: development
    needs: validate_source
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev-deploy') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev-deploy')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        shell: bash
        run: bash scripts/ci/install-cosign.sh

      - name: Resolve deployment image tag
        id: release
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          deploy_sha="${WORKFLOW_RUN_SHA:-$(git rev-parse HEAD)}"
          deploy_image_tag="sha-${deploy_sha}"

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved unsafe DEV commit SHA." >&2
            exit 1
          fi

          echo "image_tag=${deploy_image_tag}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"

      - name: Validate required secrets
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_DEV: ${{ secrets.ENV_SECRETS_DEV }}
          ENV_PAYMENTS_DEV: ${{ secrets.ENV_PAYMENTS_DEV }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            DEV_DEPLOY_HOST \
            DEV_DEPLOY_USER \
            DEV_DEPLOY_PATH \
            DEV_DEPLOY_SSH_KEY \
            DEV_DEPLOY_SSH_KNOWN_HOSTS \
            GHCR_USERNAME \
            GHCR_TOKEN \
            ENV_COMMON \
            ENV_PROVIDERS_COMMON \
            ENV_SECRETS_DEV \
            ENV_PAYMENTS_DEV
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify signed DEV GHCR images
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.commit_sha }}
          EXPECTED_WORKFLOW_REF: refs/heads/dev-deploy
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | bash scripts/deploy/docker-login-retry.sh \
            --registry ghcr.io \
            --username "${GHCR_USERNAME}"
          image_registry="ghcr.io/${EXPECTED_SOURCE_REPOSITORY,,}"
          bash scripts/deploy/verify-release-images.sh \
            --image-registry "${image_registry}" \
            --image-tag "${IMAGE_TAG}" \
            --repository "${EXPECTED_SOURCE_REPOSITORY}" \
            --revision "${EXPECTED_SOURCE_REVISION}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}"

      - name: Prepare SSH
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEV_DEPLOY_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEV_DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -l -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "Pinned DEV known_hosts is invalid." >&2
            exit 1
          fi
          if ! ssh-keygen -F "${DEV_DEPLOY_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "Pinned DEV known_hosts does not contain DEV_DEPLOY_HOST." >&2
            exit 1
          fi

      - name: Ensure DEV VPS disk headroom
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          disk_path="${deploy_path}"
          while [[ ! -e "${disk_path}" && "${disk_path}" != "/" ]]; do
            disk_path="$(dirname "${disk_path}")"
          done

          required_kb=$((2 * 1024 * 1024))
          available_kb="$(df -Pk "${disk_path}" | awk 'NR == 2 { print $4 }')"
          if [[ ! "${available_kb}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine DEV VPS disk headroom." >&2
            exit 1
          fi

          if (( available_kb < required_kb )); then
            echo "DEV VPS disk headroom is low; pruning unused Docker data without volumes."
            docker system prune --all --force >/dev/null
            available_kb="$(df -Pk "${disk_path}" | awk 'NR == 2 { print $4 }')"
          fi

          if [[ ! "${available_kb}" =~ ^[0-9]+$ ]] || (( available_kb < required_kb )); then
            available_mb=$((available_kb / 1024))
            echo "DEV VPS needs at least 2048 MiB free before checkout; ${available_mb} MiB available." >&2
            exit 1
          fi

          echo "DEV VPS disk headroom OK: $((available_kb / 1024)) MiB available."
          REMOTE

      - name: Capture current DEV image tag
        id: current_release
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          previous_image_tag="$(
            ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          if [[ ! -d "${deploy_path}/.git" ]]; then
            exit 0
          fi
          cd "${deploy_path}"

          env_tag=""
          if [[ -f .env ]]; then
            env_tag="$(grep -E '^IMAGE_TAG=' .env | tail -n 1 | cut -d= -f2- || true)"
            env_tag="${env_tag%\"}"
            env_tag="${env_tag#\"}"
            env_tag="${env_tag%\'}"
            env_tag="${env_tag#\'}"
          fi

          git_revision="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          if [[ "${env_tag}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            tag="${env_tag}"
          elif [[ "${git_revision}" =~ ^[0-9a-f]{40}$ ]]; then
            # A prior failed rollout can update the checkout before runtime .env.
            # Keep the next deploy recoverable; rollback still verifies this tag.
            tag="sha-${git_revision}"
          else
            tag=""
          fi

          printf '%s' "${tag}"
          REMOTE
          )"

          if [[ -n "${previous_image_tag}" && ! "${previous_image_tag}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Captured previous IMAGE_TAG is not an immutable full-SHA tag." >&2
            exit 1
          fi

          echo "previous_image_tag=${previous_image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact repository commit on DEV VPS
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${REPOSITORY}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          repository="$2"
          deploy_sha="$3"

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable DEV deploy commit SHA." >&2
            exit 1
          fi

          if [[ ! -d "${deploy_path}/.git" ]]; then
            mkdir -p "$(dirname "${deploy_path}")"
            git clone "https://github.com/${repository}.git" "${deploy_path}"
          fi

          cd "${deploy_path}"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked DEV VPS repository changes block immutable deploy." >&2
            exit 1
          fi

          git fetch --prune origin dev-deploy
          if ! git cat-file -e "${deploy_sha}^{commit}"; then
            echo "Selected DEV deploy commit is unavailable on the VPS." >&2
            exit 1
          fi
          git checkout --detach "${deploy_sha}"

          if [[ "$(git rev-parse --verify HEAD)" != "${deploy_sha}" || -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "DEV VPS repository does not match the immutable deploy commit." >&2
            exit 1
          fi
          REMOTE

      - name: Upload DEV env
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_DEV: ${{ secrets.ENV_SECRETS_DEV }}
          ENV_PAYMENTS_DEV: ${{ secrets.ENV_PAYMENTS_DEV }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          raw_env="$(mktemp)"
          rendered_env="$(mktemp)"
          trap 'rm -f "${raw_env}" "${rendered_env}"' EXIT

          bash scripts/deploy/assemble-env-parts.sh \
            --target dev \
            --output "${raw_env}"

          bash scripts/deploy/prepare-dev-env.sh \
            --input "${raw_env}" \
            --output "${rendered_env}" \
            --image-tag "${DEPLOY_IMAGE_TAG}" \
            --ghcr-username "${GHCR_USERNAME}" \
            --ghcr-token "${GHCR_TOKEN}"

          bash scripts/deploy/check-dev-env.sh --env-file "${rendered_env}"

          scp "${ssh_opts[@]}" "${rendered_env}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}:${DEV_DEPLOY_PATH}/.env.next"
          {
            printf 'deploy_path=%q\n' "${DEV_DEPLOY_PATH}"
            cat <<'REMOTE'
          set -euo pipefail
          cd "${deploy_path}"
          install -m 600 .env.next .env
          rm -f .env.next
          REMOTE
          } | ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" bash -s
      - name: Run DEV deploy
        id: dev_deploy
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          {
            printf 'deploy_path=%q\n' "${DEV_DEPLOY_PATH}"
            printf 'deploy_image_tag=%q\n' "${DEPLOY_IMAGE_TAG}"
            cat <<'REMOTE'
          set -euo pipefail
          cd "${deploy_path}"
          bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --skip-pull --with-cloudflare --skip-public-smoke --image-tag "${deploy_image_tag}" --timeout-seconds 240
          REMOTE
          } | ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" bash -s

      - name: Run DEV smoke
        id: dev_smoke
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          {
            printf 'deploy_path=%q\n' "${DEV_DEPLOY_PATH}"
            cat <<'REMOTE'
          set -euo pipefail
          cd "${deploy_path}"
          bash scripts/deploy/smoke-dev.sh --env-file .env --timeout-seconds 60
          REMOTE
          } | ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" bash -s

      - name: Collect DEV diagnostics after failed deploy or smoke
        if: ${{ failure() && (steps.dev_deploy.outcome == 'failure' || steps.dev_smoke.outcome == 'failure') }}
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" <<'REMOTE'
          set +e
          deploy_path="$1"
          cd "${deploy_path}" || exit 0

          compose=(docker compose --project-name vk-ai-aggregator-dev --env-file .env -f docker-compose.prod.yml)
          if [[ -f docker-compose.data.yml ]]; then
            compose+=(-f docker-compose.data.yml)
          fi
          compose+=(--profile cloudflare --profile provider-balance)

          echo "==> DEV diagnostic docker compose ps"
          "${compose[@]}" ps || true

          echo "==> DEV diagnostic migrate logs"
          "${compose[@]}" logs --no-color --tail=200 migrate || true

          for service in api worker maintenance-worker provider-webhook provider-balance-bot miniapp reverse-proxy; do
            echo "==> DEV diagnostic ${service} logs"
            "${compose[@]}" logs --no-color --tail=80 "${service}" || true
          done
          REMOTE

      - name: Roll back DEV after failed deploy or smoke
        id: dev_rollback
        if: ${{ failure() && (steps.dev_deploy.outcome == 'failure' || steps.dev_smoke.outcome == 'failure') }}
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          if [[ -z "${PREVIOUS_IMAGE_TAG}" ]]; then
            echo "No previous IMAGE_TAG was captured; automatic rollback cannot choose a target." >&2
            exit 1
          fi

          if [[ "${PREVIOUS_IMAGE_TAG}" == "${DEPLOY_IMAGE_TAG}" ]]; then
            echo "Previous IMAGE_TAG equals deployed IMAGE_TAG; rollback would be a no-op." >&2
            exit 1
          fi

          if [[ ! "${PREVIOUS_IMAGE_TAG}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Previous IMAGE_TAG is not an immutable full-SHA tag." >&2
            exit 1
          fi

          previous_revision="${PREVIOUS_IMAGE_TAG#sha-}"
          printf '%s' "${GHCR_TOKEN}" | bash scripts/deploy/docker-login-retry.sh \
            --registry ghcr.io \
            --username "${GHCR_USERNAME}"
          image_registry="ghcr.io/${EXPECTED_SOURCE_REPOSITORY,,}"
          bash scripts/deploy/verify-release-images.sh \
            --image-registry "${image_registry}" \
            --image-tag "${PREVIOUS_IMAGE_TAG}" \
            --repository "${EXPECTED_SOURCE_REPOSITORY}" \
            --revision "${previous_revision}" \
            --workflow-ref refs/heads/dev-deploy

          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${PREVIOUS_IMAGE_TAG}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          previous_image_tag="$2"
          cd "${deploy_path}"

          tmp_env="$(mktemp)"
          sed '/^IMAGE_TAG=/d' .env > "${tmp_env}"
          printf 'IMAGE_TAG=%s\n' "${previous_image_tag}" >> "${tmp_env}"
          install -m 600 "${tmp_env}" .env
          rm -f "${tmp_env}"

          bash scripts/deploy/deploy-dev.sh \
            --branch dev-deploy \
            --env-file .env \
            --project-name vk-ai-aggregator-dev \
            --skip-pull \
            --with-cloudflare \
            --skip-migrate \
            --skip-public-smoke \
            --image-tag "${previous_image_tag}" \
            --timeout-seconds 240

          bash scripts/deploy/smoke-dev.sh --env-file .env --timeout-seconds 60
          REMOTE

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.dev_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.dev_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.dev_rollback.outcome }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
        run: |
          set -euo pipefail

          deploy_outcome="${DEPLOY_OUTCOME:-skipped}"
          smoke_outcome="${SMOKE_OUTCOME:-skipped}"
          rollback_outcome="${ROLLBACK_OUTCOME:-skipped}"

          if [[ "${deploy_outcome}" == "success" && "${smoke_outcome}" == "success" ]]; then
            verdict="DEV updated successfully"
          elif [[ "${rollback_outcome}" == "success" ]]; then
            verdict="DEV deploy failed; automatic rollback completed; investigate before retry"
          elif [[ "${deploy_outcome}" == "failure" || "${smoke_outcome}" == "failure" ]]; then
            verdict="DEV deploy failed; automatic rollback did not complete"
          else
            verdict="DEV deploy did not reach runtime rollout"
          fi

          {
            echo "## Deploy DEV"
            echo
            echo "**Verdict:** ${verdict}"
            echo
            echo "- Target: configured DEV VPS"
            echo "- Deploy path: configured DEV repository path"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ steps.release.outputs.commit_sha }}\`"
            echo "- Deployed image tag: \`${DEPLOY_IMAGE_TAG:-unknown}\`"
            echo "- Previous image tag: \`${PREVIOUS_IMAGE_TAG:-unknown}\`"
            echo
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| Deploy | \`${deploy_outcome}\` |"
            echo "| Smoke | \`${smoke_outcome}\` |"
            echo "| Rollback | \`${rollback_outcome}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEV_TELEGRAM_CHAT_ID }}
          DEPLOY_OUTCOME: ${{ steps.dev_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.dev_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.dev_rollback.outcome }}
          DEPLOY_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "DEV Telegram notification skipped: DEV_TELEGRAM_BOT_TOKEN or DEV_TELEGRAM_CHAT_ID is not configured." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          deploy_outcome="${DEPLOY_OUTCOME:-skipped}"
          smoke_outcome="${SMOKE_OUTCOME:-skipped}"
          rollback_outcome="${ROLLBACK_OUTCOME:-skipped}"

          if [[ "${deploy_outcome}" == "success" && "${smoke_outcome}" == "success" ]]; then
            verdict="OK: DEV updated"
          elif [[ "${rollback_outcome}" == "success" ]]; then
            verdict="FAILED: DEV rollback completed"
          elif [[ "${deploy_outcome}" == "failure" || "${smoke_outcome}" == "failure" ]]; then
            verdict="FAILED: DEV rollback did not complete"
          else
            verdict="FAILED: DEV deploy did not reach runtime rollout"
          fi

          message="$(printf '%s\n' \
            "VK AI Aggregator DEV deploy" \
            "" \
            "Verdict: ${verdict}" \
            "Commit: ${DEPLOY_COMMIT_SHA}" \
            "Image: ${DEPLOY_IMAGE_TAG:-unknown}" \
            "Previous: ${PREVIOUS_IMAGE_TAG:-unknown}" \
            "" \
            "Deploy: ${deploy_outcome}" \
            "Smoke: ${smoke_outcome}" \
            "Rollback: ${rollback_outcome}" \
            "" \
            "Run: ${RUN_URL}")"

          if curl -fsS --retry 2 --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            >/dev/null; then
            echo "DEV Telegram notification sent." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::DEV Telegram notification failed"
            echo "DEV Telegram notification failed." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
