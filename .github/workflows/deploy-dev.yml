name: Deploy DEV

on:
  push:
    branches:
      - dev-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  validate_source:
    name: Validate DEV source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      image_run_id: ${{ steps.source.outputs.image_run_id }}
    steps:
      - name: Require exact-SHA CI and signed image release success
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ci.yml
          IMAGE_WORKFLOW: docker-images.yml
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || exit 1
          [[ "${GITHUB_REF}" == "refs/heads/dev-deploy" ]] || { echo "DEV deploy is restricted to dev-deploy." >&2; exit 1; }
          source_sha="${GITHUB_SHA}"
          source_branch="dev-deploy"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "A full immutable DEV commit SHA is required." >&2; exit 1; }

          deadline=$((SECONDS + 1800))
          while true; do
            ci_runs="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${source_sha}&event=push&per_page=100")"
            ci_success="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<< "${ci_runs}")"
            ci_active="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and .event == "push" and .status != "completed")] | length' <<< "${ci_runs}")"
            ci_failed="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and .event == "push" and .status == "completed" and .conclusion != "success")] | length' <<< "${ci_runs}")"
            (( ci_success > 0 )) && break
            (( ci_active > 0 )) || { (( ci_failed == 0 )) || { echo "CI failed for ${source_sha}." >&2; exit 1; }; }
            [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || ${ci_active} -gt 0 ]] || { echo "Manual DEV deploy requires prior successful CI." >&2; exit 1; }
            (( SECONDS < deadline )) || { echo "Timed out waiting for CI." >&2; exit 1; }
            sleep 15
          done

          while true; do
            image_runs="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${IMAGE_WORKFLOW}/runs?head_sha=${source_sha}&per_page=100")"
            image_run_id="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' <<< "${image_runs}")"
            image_active="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and (.event == "push" or .event == "workflow_dispatch") and .status != "completed")] | length' <<< "${image_runs}")"
            image_failed="$(jq -r --arg sha "${source_sha}" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "dev-deploy" and (.event == "push" or .event == "workflow_dispatch") and .status == "completed" and .conclusion != "success")] | length' <<< "${image_runs}")"
            [[ "${image_run_id}" =~ ^[0-9]+$ ]] && break
            (( image_active > 0 )) || { (( image_failed == 0 )) || { echo "Docker Images failed for ${source_sha}." >&2; exit 1; }; }
            [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || ${image_active} -gt 0 ]] || { echo "Manual DEV deploy requires prior signed images." >&2; exit 1; }
            (( SECONDS < deadline )) || { echo "Timed out waiting for signed images." >&2; exit 1; }
            sleep 15
          done

          echo "commit_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"
          echo "image_run_id=${image_run_id}" >> "${GITHUB_OUTPUT}"

  verify_release:
    name: Verify signed DEV digest release
    runs-on: ubuntu-latest
    needs: validate_source
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download exact signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.validate_source.outputs.commit_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate_source.outputs.image_run_id }}

      - name: Log in to GHCR for verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Verify manifest, identity, attestations and seven digests
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          mkdir -p verified
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@refs/heads/dev-deploy"
          bash scripts/release/verify-release-bundle.sh \
            --bundle-dir release \
            --repository "${GITHUB_REPOSITORY,,}" \
            --commit "${COMMIT_SHA}" \
            --workflow-identity "${identity}" \
            --output-env verified/release-images.env

      - name: Build portable release verifier tools
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o verified/release-manifest ./cmd/release-manifest
          cp "$(command -v cosign)" verified/cosign
          chmod 700 verified/release-manifest verified/cosign

      - name: Upload verifier output for environment-gated deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ needs.validate_source.outputs.commit_sha }}
          path: |
            release/
            verified/release-images.env
            verified/release-manifest
            verified/cosign
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy verified release to DEV
    runs-on: ubuntu-latest
    needs: [validate_source, verify_release]
    environment: development
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Download verified release state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ needs.validate_source.outputs.commit_sha }}
          path: verified-artifact

      - name: Validate required DEV secrets
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_DEV: ${{ secrets.ENV_SECRETS_DEV }}
          ENV_PAYMENTS_DEV: ${{ secrets.ENV_PAYMENTS_DEV }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEV_DEPLOY_HOST DEV_DEPLOY_USER DEV_DEPLOY_PATH DEV_DEPLOY_SSH_KEY DEV_DEPLOY_SSH_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN ENV_COMMON ENV_PROVIDERS_COMMON ENV_SECRETS_DEV ENV_PAYMENTS_DEV; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          (( ${#missing[@]} == 0 )) || { printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2; exit 1; }

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEV_DEPLOY_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEV_DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -l -f "${HOME}/.ssh/known_hosts" >/dev/null
          ssh-keygen -F "${DEV_DEPLOY_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Ensure DEV repository is at exact commit
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${REPOSITORY}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          repository="$2"
          deploy_sha="$3"
          [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ ! -d "${deploy_path}/.git" ]]; then
            mkdir -p "$(dirname "${deploy_path}")"
            git clone "https://github.com/${repository}.git" "${deploy_path}"
          fi
          cd "${deploy_path}"
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Tracked DEV changes block deploy." >&2; exit 1; }
          git fetch --prune origin dev-deploy
          git cat-file -e "${deploy_sha}^{commit}"
          git checkout --detach "${deploy_sha}"
          [[ "$(git rev-parse HEAD)" == "${deploy_sha}" ]]
          REMOTE

      - name: Upload DEV runtime env, signed bundle and verifier tools
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_DEV: ${{ secrets.ENV_SECRETS_DEV }}
          ENV_PAYMENTS_DEV: ${{ secrets.ENV_PAYMENTS_DEV }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          raw_env="$(mktemp)"
          rendered_env="$(mktemp)"
          trap 'rm -f "${raw_env}" "${rendered_env}"' EXIT
          bash scripts/deploy/assemble-env-parts.sh --target dev --output "${raw_env}"
          bash scripts/deploy/prepare-dev-env.sh --input "${raw_env}" --output "${rendered_env}" --ghcr-username "${GHCR_USERNAME}" --ghcr-token "${GHCR_TOKEN}"
          bash scripts/deploy/check-dev-env.sh --env-file "${rendered_env}"
          release_env="verified-artifact/verified/release-images.env"
          bash scripts/deploy/validate-release-env.sh --release-env-file "${release_env}" --expected-commit "$(git rev-parse HEAD)"
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          releases="${deploy_path}/.releases"
          incoming="${releases}/incoming-${release_sha}"
          install -m 700 -d "${releases}" "${releases}/sets" "${releases}/tools"
          rm -rf -- "${incoming}"
          install -m 700 -d "${incoming}"
          REMOTE
          scp "${ssh_opts[@]}" "${rendered_env}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}:${DEV_DEPLOY_PATH}/.env.next"
          scp -r "${ssh_opts[@]}" verified-artifact/release/. "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}:${DEV_DEPLOY_PATH}/.releases/incoming-${DEPLOY_COMMIT_SHA}/"
          scp "${ssh_opts[@]}" verified-artifact/verified/cosign "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}:${DEV_DEPLOY_PATH}/.releases/tools/cosign.next"
          scp "${ssh_opts[@]}" verified-artifact/verified/release-manifest "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}:${DEV_DEPLOY_PATH}/.releases/tools/release-manifest.next"
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          incoming=".releases/incoming-${release_sha}"
          target=".releases/sets/${release_sha}"
          [[ -f "${incoming}/release-manifest.json" && -f "${incoming}/release-manifest.sigstore.json" ]]
          rm -rf -- "${target}"
          mv -- "${incoming}" "${target}"
          chmod 700 .releases/tools/cosign.next .releases/tools/release-manifest.next
          mv -f .releases/tools/cosign.next .releases/tools/cosign
          mv -f .releases/tools/release-manifest.next .releases/tools/release-manifest
          install -m 600 .env.next .env
          rm -f .env.next
          REMOTE

      - name: Run DEV deploy
        id: dev_deploy
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          bundle=".releases/sets/${release_sha}"
          bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --release-bundle-dir "${bundle}" --skip-pull --with-cloudflare --skip-public-smoke --timeout-seconds 240 --dry-run
          bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --release-bundle-dir "${bundle}" --skip-pull --with-cloudflare --skip-public-smoke --timeout-seconds 240
          REMOTE

      - name: Run DEV smoke
        id: dev_smoke
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEV_DEPLOY_PATH}'; bash scripts/deploy/smoke-dev.sh --env-file .env --timeout-seconds 60"

      - name: Promote verified DEV digest set
        id: dev_promote
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          candidate_sha="$2"
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          candidate_bundle=".releases/sets/${candidate_sha}"
          bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --release-bundle-dir "${candidate_bundle}" --skip-pull --dry-run
          if [[ -f .releases/current && ! -L .releases/current ]]; then
            current_sha="$(tr -d '\r\n' < .releases/current)"
            [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            current_bundle=".releases/sets/${current_sha}"
            bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --release-bundle-dir "${current_bundle}" --skip-pull --skip-migrate --rollback-verified-release --dry-run
            printf '%s\n' "${current_sha}" > .releases/previous.next
            chmod 600 .releases/previous.next
            mv -f .releases/previous.next .releases/previous
          else
            rm -f .releases/previous
          fi
          printf '%s\n' "${candidate_sha}" > .releases/current.next
          chmod 600 .releases/current.next
          mv -f .releases/current.next .releases/current
          REMOTE

      - name: Roll back DEV to previous verified digest set
        id: dev_rollback
        if: ${{ failure() && (steps.dev_deploy.outcome == 'failure' || steps.dev_smoke.outcome == 'failure' || steps.dev_promote.outcome == 'failure') }}
        shell: bash
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'bash -s' -- "${DEV_DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          [[ -f .releases/current && ! -L .releases/current ]] || { echo "No previous verified DEV digest set is available." >&2; exit 1; }
          current_sha="$(tr -d '\r\n' < .releases/current)"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          bash scripts/deploy/deploy-dev.sh --branch dev-deploy --env-file .env --release-bundle-dir ".releases/sets/${current_sha}" --skip-pull --skip-migrate --rollback-verified-release --with-cloudflare --skip-public-smoke --timeout-seconds 240
          REMOTE

      - name: DEV deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.dev_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.dev_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.dev_rollback.outcome }}
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          {
            echo "## DEV verified release"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Trust: signed manifest + seven digest signatures + CycloneDX/SPDX/provenance attestations"
            echo "- Deploy: \`${DEPLOY_OUTCOME:-skipped}\`"
            echo "- Smoke: \`${SMOKE_OUTCOME:-skipped}\`"
            echo "- Rollback: \`${ROLLBACK_OUTCOME:-skipped}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
