name: CI

on:
  pull_request:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy
  push:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12
          args: --config=.golangci.yml ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" gitleaks
          chmod 0755 "${bin_dir}/gitleaks"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Scan current tree
        run: |
          gitleaks dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            .

      - name: Scan full git history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            .

      - name: Scan pull-request commit range
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            .

      - name: Verify deleted-secret history canary
        shell: pwsh
        run: ./scripts/ci/test-secret-scanning.ps1 -GitleaksPath gitleaks

  miniapp:
    name: Mini App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json

      - name: Validate lockfile integrity
        run: node scripts/ci/validate-npm-lockfiles.mjs web/miniapp/package-lock.json

      - name: Install dependencies
        run: npm --prefix web/miniapp ci

      - name: Lint
        run: npm --prefix web/miniapp run lint

      - name: Typecheck
        run: npm --prefix web/miniapp run typecheck

      - name: Build
        run: npm --prefix web/miniapp run build

  admin:
    name: Admin Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Validate lockfile integrity
        run: node scripts/ci/validate-npm-lockfiles.mjs web/admin/package-lock.json

      - name: Install dependencies
        run: npm --prefix web/admin ci

      - name: Lint
        run: npm --prefix web/admin run lint

      - name: Typecheck
        run: npm --prefix web/admin run typecheck

      - name: Build
        run: npm --prefix web/admin run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/ci/validate-docs.ps1

      - name: Validate infrastructure
        shell: pwsh
        run: ./scripts/ci/validate-infra.ps1

      - name: Test deploy env scripts
        shell: bash
        run: |
          bash scripts/deploy/test-dev-env.sh
          bash scripts/deploy/test-prod-env.sh
          bash scripts/deploy/test-env-parity.sh
          bash scripts/deploy/test-assemble-env-parts.sh
          bash scripts/deploy/test-verify-release-images.sh
          bash scripts/deploy/test-docker-login-retry.sh
          bash scripts/deploy/test-compose-pull-retry.sh

      - name: Test S3-compatible backup scripts
        shell: bash
        run: bash scripts/backup/test-objectsync-wrapper.sh
