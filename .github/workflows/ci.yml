name: CI

on:
  pull_request:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy
  push:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev-deploy' }}

jobs:
  session-rotation:
    name: Account security on PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: session_test
          POSTGRES_PASSWORD: session_test_fixture
          POSTGRES_DB: session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_test -d session_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify account security transactions in isolated schemas
        env:
          TEST_DATABASE_URL: postgres://session_test:session_test_fixture@127.0.0.1:5432/session_test?sslmode=disable
        run: go test ./internal/adapter/storage/postgres -run 'TestAtomicSessionRotationPostgres|TestPostgresEmailLimitAndReplacementConcurrency|TestConcurrentPostgresUnlinkPreservesSignIn|TestPostgresRecoveryRechecksEmailAndRollsBackAllSecurityWrites|TestPostgresPasswordConditionalWrites|TestPostgresSecurityNotice|TestPostgresRefreshSerializesWithPasswordRevocation|TestPostgresPasswordTransactionRollbackAndConcurrentCAS|TestPostgresPasswordLoginRejectsStaleCredentialAndBinding' -count=1 -v
      - name: Verify exact one-use proofs against Redis
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test ./internal/adapter/storage/redis -run '^TestRedisAccountLinkConsumptionIsAtomicAndExact$' -count=1 -v
      - name: Check concurrent account services with the race detector
        run: go test -race ./internal/service/accountlink ./internal/service/accountauth ./internal/service/accountnotices ./internal/adapter/storage/memory -count=1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12
          args: --config=.golangci.yml ./...

      - name: Test
        run: go test ./...

      - name: Validate model onboarding
        run: go run ./scripts/models/check

      - name: Validate shared model preview
        run: go run ./scripts/models/preview -check

      - name: Vet
        run: go vet ./...

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" gitleaks
          chmod 0755 "${bin_dir}/gitleaks"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Scan current tree
        run: |
          gitleaks dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            .

      - name: Scan full git history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            .

      - name: Scan pull-request commit range
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            .

      - name: Verify deleted-secret history canary
        shell: pwsh
        run: ./scripts/ci/test-secret-scanning.ps1 -GitleaksPath gitleaks

  platform:
    name: Web Platform
    # Playwright 1.60 Chromium is not available on the new Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_fetch_retries: "2"
      npm_config_fetch_timeout: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/platform/package-lock.json

      - name: Validate lockfile integrity
        run: node scripts/ci/validate-npm-lockfiles.mjs web/platform/package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        run: npm --prefix web/platform ci

      - name: Lint
        run: npm --prefix web/platform run lint

      - name: Typecheck
        run: npm --prefix web/platform run typecheck

      - name: Test
        run: npm --prefix web/platform run test

      - name: Verify DEV access gateway with Nginx
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/retry-network.sh --attempts 1 --timeout-seconds 300 -- bash -c \
            'sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends nginx'
          cd web/platform
          NGINX_BINARY=/usr/sbin/nginx npx vitest run src/lib/dev-access/gateway.integration.test.ts

      - name: Verify packaging contract
        run: npm --prefix web/platform run test:packaging

      - name: Install Chromium system dependencies
        timeout-minutes: 6
        working-directory: web/platform
        shell: bash
        run: bash ../../scripts/ci/retry-network.sh --attempts 1 --timeout-seconds 300 -- npx --no-install playwright install-deps chromium

      - name: Install Chromium browser
        timeout-minutes: 4
        working-directory: web/platform
        shell: bash
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
        run: bash ../../scripts/ci/retry-network.sh --attempts 2 --timeout-seconds 90 -- npx --no-install playwright install chromium

      - name: Verify session recovery across browser tabs
        timeout-minutes: 3
        working-directory: web/platform
        run: npm run test:session-browser

      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web/platform audit --omit=dev --audit-level=high --json | tee "$RUNNER_TEMP/platform-runtime-audit.json"

      - name: Audit full dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web/platform audit --audit-level=high --json | tee "$RUNNER_TEMP/platform-full-audit.json"

      - name: Build
        run: npm --prefix web/platform run build

  admin:
    name: Admin Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Validate lockfile integrity
        run: node scripts/ci/validate-npm-lockfiles.mjs web/admin/package-lock.json

      - name: Install dependencies
        run: npm --prefix web/admin ci

      - name: Lint
        run: npm --prefix web/admin run lint

      - name: Typecheck
        run: npm --prefix web/admin run typecheck

      - name: Build
        run: npm --prefix web/admin run build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test documentation validation
        shell: pwsh
        run: ./scripts/ci/test-docs-validation.ps1

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/ci/validate-docs.ps1

      - name: Test Next.js route discovery
        shell: pwsh
        run: ./scripts/ci/test-next-route-discovery.ps1

      - name: Test DEV preflight orchestration
        shell: pwsh
        run: ./scripts/ci/test-dev-deploy-preflight.ps1

      - name: Test release inventory and early source checks
        run: node --test scripts/ci/release-manifest.test.mjs scripts/ci/release-source-check.test.mjs

      - name: Test native Linux release contracts
        run: node scripts/ci/release-linux-check.mjs

      - name: Test bounded dependency downloads and DEV source selection
        shell: bash
        run: |
          bash scripts/ci/test-retry-network.sh
          bash scripts/ci/test-validate-dev-release.sh

      - name: Test Trivy filesystem exclusion scope
        shell: pwsh
        run: ./scripts/ci/test-trivy-filesystem-scope.ps1

      - name: Test explicit Bash runtime
        shell: pwsh
        run: ./scripts/ci/test-bash-runtime.ps1

      - name: Test GitHub workflow monitor
        shell: bash
        run: bash scripts/ci/test-wait-for-github-workflow.sh

      - name: Validate infrastructure
        shell: pwsh
        run: |
          ./scripts/ci/test-platform-csp.ps1
          node scripts/ci/check-retired-miniapp.mjs
          if ($LASTEXITCODE -ne 0) { throw "Mini App retirement check failed" }
          ./scripts/ci/validate-infra.ps1

      - name: Validate shared release contract
        shell: pwsh
        run: ./scripts/ci/validate-release-contract.ps1

      - name: Test S3-compatible backup scripts
        shell: bash
        run: bash scripts/backup/test-objectsync-wrapper.sh
