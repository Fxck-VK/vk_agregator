name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate_source:
    name: Validate production source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main-only production deploy
        shell: bash
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "Manual production deploy must be dispatched from refs/heads/main." >&2
                exit 1
              fi
              ;;
            workflow_run)
              if [[ "${WORKFLOW_RUN_CONCLUSION}" != "success" || "${WORKFLOW_RUN_EVENT}" != "push" || "${WORKFLOW_RUN_HEAD_BRANCH}" != "main" ]]; then
                echo "Production deploy requires a successful Docker Images push from main." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported production deploy event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: validate_source
    environment: production
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        shell: bash
        run: bash scripts/ci/install-cosign.sh

      - name: Resolve deployment image tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          deploy_sha="$(git rev-parse --verify HEAD)"
          deploy_image_tag="sha-${deploy_sha}"

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved unsafe production commit SHA." >&2
            exit 1
          fi

          echo "image_tag=${deploy_image_tag}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"

      - name: Validate required secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_PROD: ${{ secrets.ENV_SECRETS_PROD }}
          ENV_PAYMENTS_PROD: ${{ secrets.ENV_PAYMENTS_PROD }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_PATH \
            DEPLOY_SSH_KEY \
            DEPLOY_SSH_KNOWN_HOSTS \
            GHCR_USERNAME \
            GHCR_TOKEN \
            ENV_COMMON \
            ENV_PROVIDERS_COMMON \
            ENV_SECRETS_PROD \
            ENV_PAYMENTS_PROD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify signed production GHCR images
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          EXPECTED_SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REVISION: ${{ steps.release.outputs.commit_sha }}
          EXPECTED_WORKFLOW_REF: refs/heads/main
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin >/dev/null
          image_registry="ghcr.io/${EXPECTED_SOURCE_REPOSITORY,,}"
          bash scripts/deploy/verify-release-images.sh \
            --image-registry "${image_registry}" \
            --image-tag "${IMAGE_TAG}" \
            --repository "${EXPECTED_SOURCE_REPOSITORY}" \
            --revision "${EXPECTED_SOURCE_REVISION}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}"

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -l -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "Pinned production known_hosts is invalid." >&2
            exit 1
          fi
          if ! ssh-keygen -F "${DEPLOY_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "Pinned production known_hosts does not contain DEPLOY_HOST." >&2
            exit 1
          fi

      - name: Capture current production image tag
        id: current_release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          previous_image_tag="$(
            ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          cd "${deploy_path}"

          env_tag=""
          if [[ -f .env ]]; then
            env_tag="$(grep -E '^IMAGE_TAG=' .env | tail -n 1 | cut -d= -f2- || true)"
            env_tag="${env_tag%\"}"
            env_tag="${env_tag#\"}"
            env_tag="${env_tag%\'}"
            env_tag="${env_tag#\'}"
          fi

          git_short="$(git rev-parse --short=7 HEAD 2>/dev/null || true)"
          if [[ "${env_tag}" == sha-* ]]; then
            tag="${env_tag}"
          elif [[ -n "${git_short}" ]]; then
            tag="sha-${git_short}"
          else
            tag="${env_tag}"
          fi

          printf '%s' "${tag}"
          REMOTE
          )"

          if [[ -n "${previous_image_tag}" && ! "${previous_image_tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Captured unsafe previous IMAGE_TAG" >&2
            exit 1
          fi

          echo "previous_image_tag=${previous_image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Update repository on VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          deploy_sha="$2"

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable deploy commit SHA." >&2
            exit 1
          fi

          cd "${deploy_path}"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked VPS repository changes block immutable deploy." >&2
            exit 1
          fi

          git fetch --prune origin main
          if ! git cat-file -e "${deploy_sha}^{commit}"; then
            echo "Selected deploy commit is unavailable on the VPS." >&2
            exit 1
          fi
          git checkout --detach "${deploy_sha}"

          if [[ "$(git rev-parse --verify HEAD)" != "${deploy_sha}" || -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "VPS repository does not match the immutable deploy commit." >&2
            exit 1
          fi
          REMOTE

      - name: Upload production env
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_PROD: ${{ secrets.ENV_SECRETS_PROD }}
          ENV_PAYMENTS_PROD: ${{ secrets.ENV_PAYMENTS_PROD }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          tmp_env="$(mktemp)"
          trap 'rm -f "${tmp_env}"' EXIT

          bash scripts/deploy/assemble-env-parts.sh \
            --target prod \
            --output "${tmp_env}" \
            --image-tag "${DEPLOY_IMAGE_TAG}" \
            --ghcr-username "${GHCR_USERNAME}" \
            --ghcr-token "${GHCR_TOKEN}"

          scp "${ssh_opts[@]}" "${tmp_env}" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env.next"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; install -m 600 .env.next .env; rm -f .env.next"

      - name: Run production deploy
        id: production_deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; bash scripts/deploy/deploy-prod.sh --branch main --env-file .env --skip-pull --with-cloudflare --skip-public-smoke --image-tag '${DEPLOY_IMAGE_TAG}' --timeout-seconds 240"

      - name: Run production smoke
        id: production_smoke
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; bash scripts/deploy/smoke-prod.sh --env-file .env --timeout-seconds 60"

      - name: Roll back after failed deploy or smoke
        id: production_rollback
        if: ${{ failure() && (steps.production_deploy.outcome == 'failure' || steps.production_smoke.outcome == 'failure') }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)

          if [[ -z "${PREVIOUS_IMAGE_TAG}" ]]; then
            echo "No previous IMAGE_TAG was captured; automatic rollback cannot choose a target." >&2
            exit 1
          fi

          if [[ "${PREVIOUS_IMAGE_TAG}" == "${DEPLOY_IMAGE_TAG}" ]]; then
            echo "Previous IMAGE_TAG equals deployed IMAGE_TAG; rollback would be a no-op." >&2
            exit 1
          fi

          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${PREVIOUS_IMAGE_TAG}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          previous_image_tag="$2"
          cd "${deploy_path}"

          tmp_env="$(mktemp)"
          sed '/^IMAGE_TAG=/d' .env > "${tmp_env}"
          printf 'IMAGE_TAG=%s\n' "${previous_image_tag}" >> "${tmp_env}"
          install -m 600 "${tmp_env}" .env
          rm -f "${tmp_env}"

          bash scripts/deploy/rollback-prod.sh \
            --env-file .env \
            --image-tag "${previous_image_tag}" \
            --with-cloudflare \
            --skip-backup \
            --timeout-seconds 240

          bash scripts/deploy/smoke-prod.sh --env-file .env --timeout-seconds 60
          REMOTE

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.production_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.production_rollback.outcome }}
          DEPLOY_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
        run: |
          set -euo pipefail

          deploy_outcome="${DEPLOY_OUTCOME:-skipped}"
          smoke_outcome="${SMOKE_OUTCOME:-skipped}"
          rollback_outcome="${ROLLBACK_OUTCOME:-skipped}"

          if [[ "${deploy_outcome}" == "success" && "${smoke_outcome}" == "success" ]]; then
            verdict="production updated successfully"
          elif [[ "${rollback_outcome}" == "success" ]]; then
            verdict="deploy failed; automatic rollback completed; investigate before retry"
          elif [[ "${deploy_outcome}" == "failure" || "${smoke_outcome}" == "failure" ]]; then
            verdict="deploy failed; automatic rollback did not complete"
          else
            verdict="deploy did not reach runtime rollout"
          fi

          {
            echo "## Deploy Production"
            echo
            echo "**Verdict:** ${verdict}"
            echo
            echo "- Target: configured VPS"
            echo "- Deploy path: configured repository path"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${DEPLOY_COMMIT_SHA:-unknown}\`"
            echo "- Deployed image tag: \`${DEPLOY_IMAGE_TAG:-unknown}\`"
            echo "- Previous image tag: \`${PREVIOUS_IMAGE_TAG:-unknown}\`"
            echo
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| Deploy | \`${deploy_outcome}\` |"
            echo "| Smoke | \`${smoke_outcome}\` |"
            echo "| Rollback | \`${rollback_outcome}\` |"
            echo
            echo "If rollback succeeded, production should be back on the previous image tag, but this workflow remains failed by design."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_OUTCOME: ${{ steps.production_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.production_rollback.outcome }}
          DEPLOY_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          DEPLOY_IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          PREVIOUS_IMAGE_TAG: ${{ steps.current_release.outputs.previous_image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          deploy_outcome="${DEPLOY_OUTCOME:-skipped}"
          smoke_outcome="${SMOKE_OUTCOME:-skipped}"
          rollback_outcome="${ROLLBACK_OUTCOME:-skipped}"

          if [[ "${deploy_outcome}" == "success" && "${smoke_outcome}" == "success" ]]; then
            verdict="OK: production updated"
          elif [[ "${rollback_outcome}" == "success" ]]; then
            verdict="FAILED: rollback completed"
          elif [[ "${deploy_outcome}" == "failure" || "${smoke_outcome}" == "failure" ]]; then
            verdict="FAILED: rollback did not complete"
          else
            verdict="FAILED: deploy did not reach runtime rollout"
          fi

          message="$(printf '%s\n' \
            "VK AI Aggregator deploy" \
            "" \
            "Verdict: ${verdict}" \
            "Commit: ${DEPLOY_COMMIT_SHA:-unknown}" \
            "Image: ${DEPLOY_IMAGE_TAG:-unknown}" \
            "Previous: ${PREVIOUS_IMAGE_TAG:-unknown}" \
            "" \
            "Deploy: ${deploy_outcome}" \
            "Smoke: ${smoke_outcome}" \
            "Rollback: ${rollback_outcome}" \
            "" \
            "Run: ${RUN_URL}")"

          if curl -fsS --retry 2 --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            >/dev/null; then
            echo "Telegram notification sent." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Telegram notification failed"
            echo "Telegram notification failed." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"
