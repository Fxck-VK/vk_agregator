name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate_source:
    name: Validate production source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      image_run_id: ${{ steps.source.outputs.image_run_id }}
    steps:
      - name: Require exact-SHA CI and signed image release success
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ci.yml
          IMAGE_WORKFLOW: docker-images.yml
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Manual production deploy must run from main." >&2; exit 1; }
              source_sha="${GITHUB_SHA}"
              source_branch="main"
              image_run_id=""
              ;;
            workflow_run)
              [[ "${WORKFLOW_RUN_CONCLUSION}" == "success" && "${WORKFLOW_RUN_EVENT}" == "push" && "${WORKFLOW_RUN_HEAD_BRANCH}" == "main" ]] || {
                echo "Production deploy requires a successful Docker Images push from main." >&2
                exit 1
              }
              source_sha="${WORKFLOW_RUN_SHA}"
              source_branch="main"
              image_run_id="${WORKFLOW_RUN_ID}"
              image_run="$(curl --fail-with-body --silent --show-error --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${image_run_id}")"
              jq -e --arg sha "${source_sha}" \
                '.name == "Docker Images" and .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"' \
                <<< "${image_run}" >/dev/null
              ;;
            *) echo "Unsupported production deploy event." >&2; exit 1 ;;
          esac

          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "A full immutable commit SHA is required." >&2; exit 1; }

          ci_runs="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${source_sha}&event=push&status=completed&per_page=100")"
          ci_success="$(jq -r --arg sha "${source_sha}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length' \
            <<< "${ci_runs}")"
          (( ci_success > 0 )) || { echo "No successful CI run exists for ${source_sha}." >&2; exit 1; }

          image_runs="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${IMAGE_WORKFLOW}/runs?head_sha=${source_sha}&status=completed&per_page=100")"
          if [[ -z "${image_run_id}" ]]; then
            image_run_id="$(jq -r --arg sha "${source_sha}" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' \
              <<< "${image_runs}")"
          fi
          image_success="$(jq -r --argjson id "${image_run_id:-0}" \
            '[.workflow_runs[] | select(.id == $id and .status == "completed" and .conclusion == "success")] | length' \
            <<< "${image_runs}")"
          [[ "${image_run_id}" =~ ^[0-9]+$ ]] && (( image_success == 1 )) || {
            echo "No exact successful signed image release exists for ${source_sha}." >&2
            exit 1
          }

          echo "commit_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"
          echo "image_run_id=${image_run_id}" >> "${GITHUB_OUTPUT}"

  verify_release:
    name: Verify signed digest release
    runs-on: ubuntu-latest
    needs: validate_source
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download exact signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.validate_source.outputs.commit_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate_source.outputs.image_run_id }}

      - name: Log in to GHCR for verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Verify manifest, identity, attestations and seven digests
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
          SOURCE_BRANCH: ${{ needs.validate_source.outputs.source_branch }}
        run: |
          set -euo pipefail
          mkdir -p verified
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@refs/heads/${SOURCE_BRANCH}"
          bash scripts/release/verify-release-bundle.sh \
            --bundle-dir release \
            --repository "${GITHUB_REPOSITORY,,}" \
            --commit "${COMMIT_SHA}" \
            --workflow-identity "${identity}" \
            --output-env verified/release-images.env

      - name: Build portable release verifier tools
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o verified/release-manifest ./cmd/release-manifest
          cp "$(command -v cosign)" verified/cosign
          chmod 700 verified/release-manifest verified/cosign

      - name: Upload verifier output for environment-gated deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ needs.validate_source.outputs.commit_sha }}
          path: |
            release/
            verified/release-images.env
            verified/release-manifest
            verified/cosign
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy verified release to production
    runs-on: ubuntu-latest
    needs: [validate_source, verify_release]
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Download verified release state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ needs.validate_source.outputs.commit_sha }}
          path: verified-artifact

      - name: Validate required production secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_PROD: ${{ secrets.ENV_SECRETS_PROD }}
          ENV_PAYMENTS_PROD: ${{ secrets.ENV_PAYMENTS_PROD }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS GHCR_USERNAME GHCR_TOKEN ENV_COMMON ENV_PROVIDERS_COMMON ENV_SECRETS_PROD ENV_PAYMENTS_PROD; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          (( ${#missing[@]} == 0 )) || { printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2; exit 1; }

      - name: Prepare pinned SSH trust
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          ssh-keygen -l -f "${HOME}/.ssh/known_hosts" >/dev/null
          ssh-keygen -F "${DEPLOY_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Update VPS repository to exact commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          deploy_sha="$2"
          [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          cd "${deploy_path}"
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Tracked VPS changes block deploy." >&2; exit 1; }
          git fetch --prune origin main
          git cat-file -e "${deploy_sha}^{commit}"
          git checkout --detach "${deploy_sha}"
          [[ "$(git rev-parse HEAD)" == "${deploy_sha}" ]]
          REMOTE

      - name: Upload runtime env, signed bundle and verifier tools
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_COMMON: ${{ secrets.ENV_COMMON }}
          ENV_PROVIDERS_COMMON: ${{ secrets.ENV_PROVIDERS_COMMON }}
          ENV_SECRETS_PROD: ${{ secrets.ENV_SECRETS_PROD }}
          ENV_PAYMENTS_PROD: ${{ secrets.ENV_PAYMENTS_PROD }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          tmp_env="$(mktemp)"
          trap 'rm -f "${tmp_env}"' EXIT
          bash scripts/deploy/assemble-env-parts.sh --target prod --output "${tmp_env}" --ghcr-username "${GHCR_USERNAME}" --ghcr-token "${GHCR_TOKEN}"
          release_env="verified-artifact/verified/release-images.env"
          bash scripts/deploy/validate-release-env.sh --release-env-file "${release_env}" --expected-commit "$(git rev-parse HEAD)"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          releases="${deploy_path}/.releases"
          incoming="${releases}/incoming-${release_sha}"
          install -m 700 -d "${releases}" "${releases}/sets" "${releases}/tools"
          rm -rf -- "${incoming}"
          install -m 700 -d "${incoming}"
          REMOTE
          scp "${ssh_opts[@]}" "${tmp_env}" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env.next"
          scp -r "${ssh_opts[@]}" verified-artifact/release/. "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.releases/incoming-${DEPLOY_COMMIT_SHA}/"
          scp "${ssh_opts[@]}" verified-artifact/verified/cosign "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.releases/tools/cosign.next"
          scp "${ssh_opts[@]}" verified-artifact/verified/release-manifest "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.releases/tools/release-manifest.next"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          incoming=".releases/incoming-${release_sha}"
          target=".releases/sets/${release_sha}"
          [[ -f "${incoming}/release-manifest.json" && -f "${incoming}/release-manifest.sigstore.json" ]]
          rm -rf -- "${target}"
          mv -- "${incoming}" "${target}"
          chmod 700 .releases/tools/cosign.next .releases/tools/release-manifest.next
          mv -f .releases/tools/cosign.next .releases/tools/cosign
          mv -f .releases/tools/release-manifest.next .releases/tools/release-manifest
          install -m 600 .env.next .env
          rm -f .env.next
          REMOTE

      - name: Run production deploy
        id: production_deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          release_sha="$2"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          bundle=".releases/sets/${release_sha}"
          bash scripts/deploy/deploy-prod.sh --branch main --env-file .env --release-bundle-dir "${bundle}" --skip-pull --with-cloudflare --skip-public-smoke --timeout-seconds 240 --dry-run
          bash scripts/deploy/deploy-prod.sh --branch main --env-file .env --release-bundle-dir "${bundle}" --skip-pull --with-cloudflare --skip-public-smoke --timeout-seconds 240
          REMOTE

      - name: Run production smoke
        id: production_smoke
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; bash scripts/deploy/smoke-prod.sh --env-file .env --timeout-seconds 60"

      - name: Promote verified digest set
        id: production_promote
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" "${DEPLOY_COMMIT_SHA}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          candidate_sha="$2"
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          candidate_bundle=".releases/sets/${candidate_sha}"
          bash scripts/deploy/deploy-prod.sh --branch main --env-file .env --release-bundle-dir "${candidate_bundle}" --skip-pull --dry-run
          if [[ -f .releases/current && ! -L .releases/current ]]; then
            current_sha="$(tr -d '\r\n' < .releases/current)"
            [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            current_bundle=".releases/sets/${current_sha}"
            bash scripts/deploy/rollback-prod.sh --release-bundle-dir "${current_bundle}" --env-file .env --skip-backup --dry-run
            printf '%s\n' "${current_sha}" > .releases/previous.next
            chmod 600 .releases/previous.next
            mv -f .releases/previous.next .releases/previous
          else
            rm -f .releases/previous
          fi
          printf '%s\n' "${candidate_sha}" > .releases/current.next
          chmod 600 .releases/current.next
          mv -f .releases/current.next .releases/current
          REMOTE

      - name: Roll back to previous verified digest set
        id: production_rollback
        if: ${{ failure() && (steps.production_deploy.outcome == 'failure' || steps.production_smoke.outcome == 'failure' || steps.production_promote.outcome == 'failure') }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          [[ -f .releases/current && ! -L .releases/current ]] || { echo "No previous verified digest set is available." >&2; exit 1; }
          current_sha="$(tr -d '\r\n' < .releases/current)"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          export COSIGN_BIN=.releases/tools/cosign
          export RELEASE_MANIFEST_BIN=.releases/tools/release-manifest
          bash scripts/deploy/rollback-prod.sh --release-bundle-dir ".releases/sets/${current_sha}" --env-file .env --with-cloudflare --skip-backup --timeout-seconds 240
          REMOTE

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.production_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.production_rollback.outcome }}
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
        run: |
          {
            echo "## Production verified release"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Trust: signed manifest + seven digest signatures + CycloneDX/SPDX/provenance attestations"
            echo "- Deploy: \`${DEPLOY_OUTCOME:-skipped}\`"
            echo "- Smoke: \`${SMOKE_OUTCOME:-skipped}\`"
            echo "- Rollback: \`${ROLLBACK_OUTCOME:-skipped}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
