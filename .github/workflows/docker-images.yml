name: Docker Images

on:
  pull_request:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy
  push:
    branches:
      - main
      - serega
      - feature/integration-web-backend
      - integration-web-backend
      - integration_web_backend
      - dev-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev-deploy' }}

jobs:
  validate_source:
    name: Validate image source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main-only manual image build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual Docker Images dispatch is restricted to refs/heads/main." >&2
            exit 1
          fi

  quality-gate:
    name: Require successful CI for exact SHA
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-deploy')
    runs-on: ubuntu-latest
    needs: validate_source
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout monitor script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for exact-SHA CI success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ci/wait-for-github-workflow.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --sha "${GITHUB_SHA}" \
            --event push \
            --max-attempts 60 \
            --initial-delay-seconds 5 \
            --max-delay-seconds 30

  pull-request-build:
    name: Build ${{ matrix.service }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.ref != 'refs/heads/main' &&
       github.ref != 'refs/heads/dev-deploy')
    runs-on: ubuntu-latest
    needs: validate_source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
          - service: provider-webhook
            dockerfile: Dockerfile.provider-webhook
          - service: provider-balance-bot
            dockerfile: Dockerfile.provider-balance-bot
          - service: miniapp
            dockerfile: Dockerfile.miniapp
          - service: platform
            dockerfile: Dockerfile.platform
          - service: migrate
            dockerfile: Dockerfile.migrate
          - service: backup
            dockerfile: Dockerfile.backup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: type=sha,prefix=pr-sha-,format=long

      - name: Build without registry publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  publish:
    name: Publish signed ${{ matrix.service }}
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-deploy')
    runs-on: ubuntu-latest
    needs: [validate_source, quality-gate]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
          - service: provider-webhook
            dockerfile: Dockerfile.provider-webhook
          - service: provider-balance-bot
            dockerfile: Dockerfile.provider-balance-bot
          - service: miniapp
            dockerfile: Dockerfile.miniapp
          - service: platform
            dockerfile: Dockerfile.platform
          - service: migrate
            dockerfile: Dockerfile.migrate
          - service: backup
            dockerfile: Dockerfile.backup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image namespace
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAMESPACE=${image_namespace}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=ghcr.io/${image_namespace}/${{ matrix.service }}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
          github-token: ${{ github.token }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Install Trivy
        shell: bash
        run: bash scripts/ci/install-trivy.sh

      - name: Scan immutable digest before signing
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest_ref="${IMAGE_REF}@${IMAGE_DIGEST}"
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "${image_digest_ref}"

      - name: Install Cosign
        shell: bash
        run: bash scripts/ci/install-cosign.sh

      - name: Sign and verify immutable digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest_ref="${IMAGE_REF}@${IMAGE_DIGEST}"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@${GITHUB_REF}"

          cosign sign --yes "${image_digest_ref}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image_digest_ref}" >/dev/null

      - name: Assert attached SBOM and provenance are nonempty
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_digest_ref="${IMAGE_REF}@${IMAGE_DIGEST}"
          sbom="$(docker buildx imagetools inspect "${image_digest_ref}" --format '{{ json .SBOM.SPDX }}')"
          provenance="$(docker buildx imagetools inspect "${image_digest_ref}" --format '{{ json .Provenance.SLSA }}')"

          if ! jq -e 'type == "object" and (.spdxVersion | startswith("SPDX-")) and ((.packages // []) | length > 0)' <<<"${sbom}" >/dev/null; then
            echo "SBOM assertion failed: expected nonempty SPDX package inventory." >&2
            exit 1
          fi
          if ! jq -e '
            def nonempty_string: type == "string" and length > 0;
            type == "object" and (
              ((.buildType | nonempty_string) and (.builder.id | nonempty_string)) or
              ((.buildDefinition.buildType | nonempty_string) and (.runDetails.builder.id | nonempty_string))
            )
          ' <<<"${provenance}" >/dev/null; then
            echo "Provenance assertion failed: expected nonempty SLSA v0.2 or v1 builder metadata." >&2
            exit 1
          fi
