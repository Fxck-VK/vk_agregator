name: Docker Images

on:
  push:
    branches:
      - main
      - dev-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_source:
    name: Validate image source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_branch: ${{ steps.source.outputs.source_branch }}
    steps:
      - name: Resolve immutable image source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != "refs/heads/dev-deploy" ]]; then
                echo "Docker image pushes are restricted to main and dev-deploy." >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "Manual Docker Images dispatch is restricted to refs/heads/main." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported Docker Images event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Docker Images requires a full immutable commit SHA." >&2
            exit 1
          fi

          echo "commit_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Require successful CI for exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ci.yml
          SOURCE_SHA: ${{ steps.source.outputs.commit_sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1800))
          while true; do
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100")"

            successful_runs="$(jq -r \
              --arg sha "${SOURCE_SHA}" \
              --arg branch "${SOURCE_BRANCH}" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == $branch and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | length' <<< "${response}")"
            failed_runs="$(jq -r \
              --arg sha "${SOURCE_SHA}" \
              --arg branch "${SOURCE_BRANCH}" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == $branch and
                .event == "push" and
                .status == "completed" and
                .conclusion != "success"
              )] | length' <<< "${response}")"
            active_runs="$(jq -r \
              --arg sha "${SOURCE_SHA}" \
              --arg branch "${SOURCE_BRANCH}" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == $branch and
                .event == "push" and
                .status != "completed"
              )] | length' <<< "${response}")"

            if (( successful_runs > 0 )); then
              echo "Successful CI confirmed for exact commit ${SOURCE_SHA}."
              break
            fi
            if (( active_runs == 0 && failed_runs > 0 )); then
              echo "CI completed without success for exact commit ${SOURCE_SHA}." >&2
              exit 1
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && ${active_runs} -eq 0 ]]; then
              echo "Manual Docker Images dispatch requires prior successful CI for ${SOURCE_SHA}." >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for successful CI for exact commit ${SOURCE_SHA}." >&2
              exit 1
            fi

            echo "Waiting for CI on exact commit ${SOURCE_SHA}."
            sleep 15
          done

  publish:
    name: Publish and sign ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate_source
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
          - service: provider-webhook
            dockerfile: Dockerfile.provider-webhook
          - service: provider-balance-bot
            dockerfile: Dockerfile.provider-balance-bot
          - service: miniapp
            dockerfile: Dockerfile.miniapp
          - service: migrate
            dockerfile: Dockerfile.migrate
          - service: backup
            dockerfile: Dockerfile.backup

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ needs.validate_source.outputs.commit_sha }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve published digest
        id: image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return an immutable sha256 digest." >&2
            exit 1
          fi
          image_repository="ghcr.io/${IMAGE_NAMESPACE}/${SERVICE}"
          echo "repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "ref=${image_repository}@${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0

      - name: Generate and validate release SBOMs and provenance
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          artifact_dir="release/${SERVICE}"
          mkdir -p "${artifact_dir}"

          syft "${IMAGE_REF}" \
            -o "cyclonedx-json=${artifact_dir}/runtime.cdx.json"

          docker buildx imagetools inspect "${IMAGE_REF}" \
            --format '{{ json .SBOM.SPDX }}' > "${artifact_dir}/runtime.spdx.json"
          jq -e 'type == "object" and length > 0' "${artifact_dir}/runtime.spdx.json" >/dev/null

          docker buildx imagetools inspect "${IMAGE_REF}" \
            --format '{{ json .Provenance.SLSA }}' > "${artifact_dir}/provenance.buildkit.json"
          jq --arg commit_sha "${COMMIT_SHA}" \
            --arg image_digest "${DIGEST}" \
            --arg image_repository "${IMAGE_REPOSITORY}" \
            '.metadata = (.metadata // {}) |
             .metadata["https://github.com/Fxck-VK/vk_agregator/release/v1"] = {
               commit_sha: $commit_sha,
               image_digest: $image_digest,
               image_repository: $image_repository
             }' \
            "${artifact_dir}/provenance.buildkit.json" > "${artifact_dir}/provenance.json"
          rm -f "${artifact_dir}/provenance.buildkit.json"
          jq -e 'type == "object" and length > 0' "${artifact_dir}/provenance.json" >/dev/null

          if [[ "${SERVICE}" == "miniapp" ]]; then
            syft dir:web/miniapp \
              -o "cyclonedx-json=${artifact_dir}/source.cdx.json" \
              -o "spdx-json=${artifact_dir}/source.spdx.json"
            bash scripts/release/validate-sbom.sh "${SERVICE}" \
              "${artifact_dir}/runtime.cdx.json" "${artifact_dir}/runtime.spdx.json" \
              "${artifact_dir}/source.cdx.json" "${artifact_dir}/source.spdx.json"
          else
            bash scripts/release/validate-sbom.sh "${SERVICE}" \
              "${artifact_dir}/runtime.cdx.json" "${artifact_dir}/runtime.spdx.json"
          fi

      - name: Gate HIGH and CRITICAL vulnerabilities on final digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.72.0
          format: json
          output: release/${{ matrix.service }}/trivy.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false

      - name: Enforce digest-bound Trivy policy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          SERVICE: ${{ matrix.service }}
        run: bash scripts/release/enforce-trivy-policy.sh "release/${SERVICE}/trivy.json" "${IMAGE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Sign digest and attest SBOM and provenance
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          SERVICE: ${{ matrix.service }}
          SOURCE_BRANCH: ${{ needs.validate_source.outputs.source_branch }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@refs/heads/${SOURCE_BRANCH}"
          issuer="https://token.actions.githubusercontent.com"
          artifact_dir="release/${SERVICE}"

          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --type cyclonedx --predicate "${artifact_dir}/runtime.cdx.json" "${IMAGE_REF}"
          cosign attest --yes --type spdx --predicate "${artifact_dir}/runtime.spdx.json" "${IMAGE_REF}"
          cosign attest --yes --type slsaprovenance --predicate "${artifact_dir}/provenance.json" "${IMAGE_REF}"
          if [[ "${SERVICE}" == "miniapp" ]]; then
            cosign attest --yes --type cyclonedx --predicate "${artifact_dir}/source.cdx.json" "${IMAGE_REF}"
            cosign attest --yes --type spdx --predicate "${artifact_dir}/source.spdx.json" "${IMAGE_REF}"
          fi

          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE_REF}" >/dev/null
          bash scripts/release/verify-attestation-predicate.sh "${IMAGE_REF}" cyclonedx "${artifact_dir}/runtime.cdx.json" "${identity}" "${issuer}"
          bash scripts/release/verify-attestation-predicate.sh "${IMAGE_REF}" spdx "${artifact_dir}/runtime.spdx.json" "${identity}" "${issuer}"
          bash scripts/release/verify-attestation-predicate.sh "${IMAGE_REF}" slsaprovenance "${artifact_dir}/provenance.json" "${identity}" "${issuer}"
          if [[ "${SERVICE}" == "miniapp" ]]; then
            bash scripts/release/verify-attestation-predicate.sh "${IMAGE_REF}" cyclonedx "${artifact_dir}/source.cdx.json" "${identity}" "${issuer}"
            bash scripts/release/verify-attestation-predicate.sh "${IMAGE_REF}" spdx "${artifact_dir}/source.spdx.json" "${identity}" "${issuer}"
          fi

      - name: Write digest-bound image metadata
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          bash scripts/release/write-image-metadata.sh \
            "${SERVICE}" "${IMAGE_REPOSITORY}" "${DIGEST}" release v0.72.0

      - name: Upload image release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ matrix.service }}-${{ needs.validate_source.outputs.commit_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Assemble, verify and sign release manifest
    runs-on: ubuntu-latest
    needs: [validate_source, publish]
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all seven image evidence artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publish-*-${{ needs.validate_source.outputs.commit_sha }}
          path: release
          merge-multiple: true

      - name: Log in to GitHub Container Registry for verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Assemble and verify release manifest
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate_source.outputs.commit_sha }}
          SOURCE_BRANCH: ${{ needs.validate_source.outputs.source_branch }}
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@refs/heads/${SOURCE_BRANCH}"

          go run ./cmd/release-manifest assemble \
            --input-dir release \
            --output release/release-manifest.json \
            --repository "${image_namespace}" \
            --commit "${COMMIT_SHA}" \
            --branch "${SOURCE_BRANCH}" \
            --workflow-identity "${identity}"

          for service in api worker provider-webhook provider-balance-bot miniapp migrate backup; do
            image_ref="$(jq -er --arg service "${service}" '.images[] | select(.service == $service) | .repository + "@" + .digest' release/release-manifest.json)"
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image_ref}" >/dev/null
            artifact_dir="release/${service}"
            bash scripts/release/verify-attestation-predicate.sh "${image_ref}" cyclonedx "${artifact_dir}/runtime.cdx.json" "${identity}" https://token.actions.githubusercontent.com
            bash scripts/release/verify-attestation-predicate.sh "${image_ref}" spdx "${artifact_dir}/runtime.spdx.json" "${identity}" https://token.actions.githubusercontent.com
            bash scripts/release/verify-attestation-predicate.sh "${image_ref}" slsaprovenance "${artifact_dir}/provenance.json" "${identity}" https://token.actions.githubusercontent.com
            if [[ "${service}" == "miniapp" ]]; then
              bash scripts/release/verify-attestation-predicate.sh "${image_ref}" cyclonedx "${artifact_dir}/source.cdx.json" "${identity}" https://token.actions.githubusercontent.com
              bash scripts/release/verify-attestation-predicate.sh "${image_ref}" spdx "${artifact_dir}/source.spdx.json" "${identity}" https://token.actions.githubusercontent.com
            fi
          done

      - name: Sign and verify release manifest blob
        shell: bash
        env:
          SOURCE_BRANCH: ${{ needs.validate_source.outputs.source_branch }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-images.yml@refs/heads/${SOURCE_BRANCH}"
          cosign sign-blob --yes \
            --bundle release/release-manifest.sigstore.json \
            release/release-manifest.json
          cosign verify-blob \
            --bundle release/release-manifest.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/release-manifest.json >/dev/null

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.validate_source.outputs.commit_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
