<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <defs>
    <mask id="face-cutout">
      <rect width="1024" height="1024" fill="black"/>

      <!-- Корпус -->
      <rect
        x="180"
        y="180"
        width="664"
        height="664"
        rx="154"
        fill="white"
      />

      <!-- Глаза -->
      <rect
        x="388"
        y="380"
        width="54"
        height="138"
        rx="27"
        fill="black"
      />

      <rect
        x="582"
        y="380"
        width="54"
        height="138"
        rx="27"
        fill="black"
      />

      <!-- Улыбка -->
      <path
        d="M405 585
           C435 625 473 645 512 645
           C551 645 589 625 619 585"
        stroke="black"
        stroke-width="46"
        stroke-linecap="round"
        fill="none"
      />
    </mask>
  </defs>

  <g fill="#15161C">

    <!-- Верхние контакты -->
    <rect x="304" y="36" width="104" height="210" rx="52"/>
    <rect x="460" y="36" width="104" height="210" rx="52"/>
    <rect x="616" y="36" width="104" height="210" rx="52"/>

    <!-- Нижние контакты -->
    <rect x="304" y="778" width="104" height="210" rx="52"/>
    <rect x="460" y="778" width="104" height="210" rx="52"/>
    <rect x="616" y="778" width="104" height="210" rx="52"/>

    <!-- Левые контакты -->
    <rect x="36" y="304" width="210" height="104" rx="52"/>
    <rect x="36" y="460" width="210" height="104" rx="52"/>
    <rect x="36" y="616" width="210" height="104" rx="52"/>

    <!-- Правые контакты -->
    <rect x="778" y="304" width="210" height="104" rx="52"/>
    <rect x="778" y="460" width="210" height="104" rx="52"/>
    <rect x="778" y="616" width="210" height="104" rx="52"/>

    <!-- Корпус -->
    <rect
      width="1024"
      height="1024"
      mask="url(#face-cutout)"
    />

  </g>
</svg>
