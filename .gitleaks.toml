title = "VK AI Aggregator Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Git internals are not source files for current-tree secret scanning"
paths = [
  '''(^|/)\.git/''',
]

[[rules]]
id = "vk-access-token"
description = "VK API access token"
regex = '''vk1\.[A-Za-z]\.[A-Za-z0-9_-]{80,}'''
keywords = [
  "vk1.",
]

[[rules]]
id = "yookassa-secret-key"
description = "YooKassa API secret key"
regex = '''(?:test|live)__[A-Za-z0-9_-]{20,}'''
keywords = [
  "test__",
  "live__",
]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''[0-9]{8,12}:[A-Za-z0-9_-]{30,}'''
keywords = [
  ":",
]

[[rules]]
id = "project-secret-assignment"
description = "Project secret assigned to an environment-like key"
regex = '''(?i)(?:VK_ACCESS_TOKEN|VK_VIDEO_ACCESS_TOKEN|VK_SECRET|VK_APP_SECRET|VK_CONFIRMATION_TOKEN|OPENAI_API_KEY|DEEPINFRA_API_KEY|GEMINI_API_KEY|APIMART_API_KEY|POYO_API_KEY|RUNWAYML_API_SECRET|YOOKASSA_SECRET_KEY|TELEGRAM_BOT_TOKEN|ACCOUNT_OAUTH_TELEGRAM_BOT_TOKEN|ALERT_TELEGRAM_BOT_TOKEN|DEV_TELEGRAM_BOT_TOKEN|GRAFANA_ADMIN_PASSWORD|GRAFANA_SECRET_KEY|ADMIN_TOKEN|GHCR_TOKEN|CLOUDFLARED_TUNNEL_TOKEN|ACCOUNT_EMAIL_SMTP_PASSWORD|FRONTEND_TELEMETRY_USER_HASH_SECRET|POSTGRES_PASSWORD|REDIS_PASSWORD|MINIO_ROOT_PASSWORD|S3_ACCESS_KEY|S3_SECRET_KEY)[ \t]*[:=][ \t]*['"]?([A-Za-z0-9._~:/+=-]{16,})['"]?'''
secretGroup = 1
keywords = [
  "VK_ACCESS_TOKEN",
  "VK_VIDEO_ACCESS_TOKEN",
  "VK_SECRET",
  "VK_APP_SECRET",
  "VK_CONFIRMATION_TOKEN",
  "OPENAI_API_KEY",
  "DEEPINFRA_API_KEY",
  "GEMINI_API_KEY",
  "APIMART_API_KEY",
  "POYO_API_KEY",
  "RUNWAYML_API_SECRET",
  "YOOKASSA_SECRET_KEY",
  "TELEGRAM_BOT_TOKEN",
  "ACCOUNT_OAUTH_TELEGRAM_BOT_TOKEN",
  "ALERT_TELEGRAM_BOT_TOKEN",
  "DEV_TELEGRAM_BOT_TOKEN",
  "GRAFANA_ADMIN_PASSWORD",
  "GRAFANA_SECRET_KEY",
  "ADMIN_TOKEN",
  "GHCR_TOKEN",
  "CLOUDFLARED_TUNNEL_TOKEN",
  "ACCOUNT_EMAIL_SMTP_PASSWORD",
  "FRONTEND_TELEMETRY_USER_HASH_SECRET",
  "POSTGRES_PASSWORD",
  "REDIS_PASSWORD",
  "MINIO_ROOT_PASSWORD",
  "S3_ACCESS_KEY",
  "S3_SECRET_KEY",
]

  [[rules.allowlists]]
  description = "Exact non-secret values in committed environment templates"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)\.env(?:\.[a-z0-9_-]+)?\.example$''',
  ]
  regexes = [
    '''^(?:loadtest-confirmation|loadtest-admin-token|CHANGE_ME_DEV_VK_ACCESS_TOKEN|CHANGE_ME_DEV_VK_CALLBACK_SECRET|CHANGE_ME_DEV_VK_CONFIRMATION_TOKEN|CHANGE_ME_DEV_ADMIN_TOKEN|CHANGE_ME_VK_ACCESS_TOKEN|CHANGE_ME_VK_CALLBACK_SECRET|CHANGE_ME_VK_CONFIRMATION_TOKEN|CHANGE_ME_LONG_RANDOM_ADMIN_TOKEN|CHANGE_ME_YOOKASSA_SECRET_KEY|CHANGE_ME_DEEPINFRA_API_KEY|CHANGE_ME_OPENAI_API_KEY|CHANGE_ME_GRAFANA_ADMIN_PASSWORD|CHANGE_ME_S3_ACCESS_KEY|CHANGE_ME_S3_SECRET_KEY|change-me-local-only|dev-confirmation)$''',
  ]

  [[rules.allowlists]]
  description = "Grafana password is referenced from an environment variable"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)docker-compose\.observability\.yml$''',
  ]
  regexes = [
    '''^-?change-me-local-only$''',
  ]

  [[rules.allowlists]]
  description = "Exact load-test admin placeholder documented for local mock runs"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)docs/LOAD_TESTING\.md$''',
  ]
  regexes = [
    '''^loadtest-admin-token$''',
  ]

  [[rules.allowlists]]
  description = "Exact mock credentials used by the DEV env script tests"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)scripts/deploy/test-dev-env\.sh$''',
  ]
  regexes = [
    '''^(?:deepinfra-placeholder|deepinfra-dev-test-key|vk-token-placeholder|vk-callback-placeholder|vk-confirmation-placeholder|yookassa-key-placeholder|secret-vk-token-for-test|secret-vk-callback-for-test|secret-vk-confirmation-for-test|secret-yookassa-key-for-test)$''',
  ]

  [[rules.allowlists]]
  description = "Exact mock credentials used by release bundle tests"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)scripts/deploy/test-release-bundle\.ps1$''',
  ]
  regexes = [
    '''^(?:vk-live-confirmation|admin-live-token)$''',
  ]

  [[rules.allowlists]]
  description = "Exact DEV placeholder assignments asserted by infra validation"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)scripts/ci/validate-infra\.ps1$''',
  ]
  regexes = [
    '''^(?:CHANGE_ME_DEV_VK_ACCESS_TOKEN|CHANGE_ME_DEV_VK_CALLBACK_SECRET|CHANGE_ME_DEV_VK_CONFIRMATION_TOKEN)$''',
  ]

  [[rules.allowlists]]
  description = "Word-only placeholders in historical env templates and validation fixtures"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)\.env(?:\.[a-z0-9_-]+)?\.example$''',
    '''(?i)(^|/)docker-compose(?:\.data|\.observability)?\.yml$''',
    '''(?i)(^|/)scripts/(?:ci/validate-infra\.ps1|deploy/test-(?:dev-env\.sh|env-parity\.sh|release-bundle\.ps1))$''',
  ]
  regexes = [
    '''^-?[A-Za-z]{2,}(?:[-_][A-Za-z]{2,}){1,}$''',
    '''^-?(?:local-postgres-password|local-minio-password|change-me-local-only-secret)$''',
  ]

  [[rules.allowlists]]
  description = "Exact Admin UI rendering canary"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)web/admin/e2e/admin\.smoke\.spec\.ts$''',
  ]
  regexes = [
    '''^stage9_admin_token_must_not_render$''',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Exact admin idempotency fixtures"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)internal/adapter/inbound/admin/handler_test\.go$''',
  ]
  regexes = [
    '''^(?:stage7-idempotency-marker-(?:one|two)|stage7-private-key-(?:1|2)|stage7-payment-key)$''',
  ]

  [[rules.allowlists]]
  description = "Exact Admin UI rendering canary"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)web/admin/e2e/admin\.smoke\.spec\.ts$''',
  ]
  regexes = [
    '''^stage9_admin_token_must_not_render$''',
  ]

  [[rules.allowlists]]
  description = "Exact operator idempotency placeholder in runbooks"
  condition = "AND"
  regexTarget = "secret"
  paths = [
    '''(?i)(^|/)(?:RUNBOOK\.md|docs/BILLING_AGENT_HANDOFF\.md)$''',
  ]
  regexes = [
    '''^operator-ticket-123$''',
  ]

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Exact local operator commands using environment-backed credentials"
  condition = "AND"
  regexTarget = "match"
  paths = [
    '''(?i)(^|/)(?:RUNBOOK\.md|docs/BILLING_AGENT_HANDOFF\.md)$''',
  ]
  regexes = [
    '''X-Admin-Token:\s*\$ADMIN_TOKEN''',
  ]
