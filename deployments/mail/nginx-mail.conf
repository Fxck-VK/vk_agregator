map $request_method $mail_post_key {
    default '';
    POST $binary_remote_addr;
}
limit_req_zone $mail_post_key zone=mail_posts:1m rate=30r/m;

server {
    listen 80;
    server_name mail.epifera.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://mail.epifera.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.epifera.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mail.epifera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.epifera.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MAIL_TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        limit_req zone=mail_posts burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://webmail:80;
        proxy_set_header Host mail.epifera.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
