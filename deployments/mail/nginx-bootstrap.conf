server {
    listen 80;
    server_name mail.epifera.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 'Epifera mail setup is in progress.\n';
    }
}
