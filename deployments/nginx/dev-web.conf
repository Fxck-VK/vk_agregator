upstream platform_frontend {
    server platform:3000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=dev_web_login:1m rate=10r/m;

server {
    listen 80;
    server_name dev-web.neiirohub.ru;

    # Do not let shared caches serve gated files without a session check.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(admin|metrics|debug|billing|readyz|healthz)(/|$) {
        return 404;
    }

    # The only place allowed to challenge for a password. After successful
    # verification, mint a 30-day cookie using a private proof, never the password.
    location = /__dev/login {
        limit_except GET { deny all; }
        limit_req zone=dev_web_login burst=10 nodelay;
        limit_req_status 429;
        auth_basic "NeiroHub development";
        auth_basic_user_file /tmp/dev-web.htpasswd;
        include /tmp/dev-web-issuer.conf;
        proxy_set_header X-Dev-Web-User $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_pass http://platform_frontend/web/dev-access/issue;
    }

    location ^~ /web/dev-access { return 404; }
    location ^~ /__dev/ { return 404; }

    location = /_dev_access_check {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Connection "";
        proxy_pass http://platform_frontend/web/dev-access/check;
    }

    location @dev_access_required {
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Dev-Web-Return-To $request_uri;
        proxy_set_header X-Dev-Web-Original-Method $request_method;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
        proxy_set_header Connection "";
        rewrite ^ /web/dev-access/required break;
        proxy_pass http://platform_frontend;
    }

    location / {
        auth_request /_dev_access_check;
        error_page 401 = @dev_access_required;
        # Leave account/API errors to the application, without a Basic challenge.
        proxy_intercept_errors off;
        proxy_hide_header WWW-Authenticate;
        proxy_set_header X-Dev-Web-Proof "";
        proxy_set_header X-Dev-Web-User "";
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_pass http://platform_frontend;
    }
}
