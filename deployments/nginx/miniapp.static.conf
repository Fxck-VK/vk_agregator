server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = / {
        # Inline styles are emitted by the current React UI. Scripts remain
        # strict: no unsafe-inline and no unsafe-eval.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.userapi.com https://*.vkuserphoto.ru https://*.vk-cdn.net; media-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.userapi.com https://*.vkuserphoto.ru https://*.vk-cdn.net; media-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.userapi.com https://*.vkuserphoto.ru https://*.vk-cdn.net; media-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.userapi.com https://*.vkuserphoto.ru https://*.vk-cdn.net; media-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
