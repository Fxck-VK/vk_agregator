worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not log query strings: callback payload hints and
    # payment identifiers must not leak into reverse-proxy logs.
    log_format main '$remote_addr $host "$request_method $uri" '
                    '$status $body_bytes_sent $request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server_tokens off;
    # API/default responses carry the same defensive baseline as the website.
    # The website host defines its own headers and preserves its nonce CSP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=payment_redirect_per_ip:10m rate=5r/s;

    upstream api {
        server api:8080;
        keepalive 32;
    }

    upstream provider_webhook {
        server provider-webhook:8082;
        keepalive 8;
    }


    # docker-compose.dev-web.yml replaces this inert fragment only in DEV.
    include /etc/nginx/dev-web.conf;

    server {
        listen 80 default_server;
        server_name _;

        location = /proxy-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name vk.epifera.com dev-vk.epifera.com;

        # Signed job-bound provider reads are independent of client applications.
        location ^~ /provider-references/ {
            access_log off;
            error_log /dev/null crit;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location = /webhooks/vk {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location = /health {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location = /billing/webhooks/yookassa {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "proto=https;host=$host";
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_set_header Connection "";
            proxy_pass http://provider_webhook;
        }

        location ^~ /payments/vk/ {
            access_log off;
            limit_req zone=payment_redirect_per_ip burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location ~ ^/(admin|metrics|debug|billing|readyz|healthz)(/|$) {
            return 404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name epifera.com dev.epifera.com;

        location = /billing/webhooks/yookassa {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "proto=https;host=$host";
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_set_header Connection "";
            proxy_pass http://provider_webhook;
        }

        location / {
            return 404;
        }
    }

}
