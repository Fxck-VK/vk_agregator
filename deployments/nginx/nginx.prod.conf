worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not log query strings: VK launch params, callback payload hints and
    # payment identifiers must not leak into reverse-proxy logs.
    log_format main '$remote_addr $host "$request_method $uri" '
                    '$status $body_bytes_sent $request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=payment_redirect_per_ip:10m rate=5r/s;

    upstream api {
        server api:8080;
        keepalive 32;
    }

    upstream provider_webhook {
        server provider-webhook:8082;
        keepalive 8;
    }

    upstream miniapp_frontend {
        server miniapp:8080;
        keepalive 16;
    }

    # docker-compose.dev-web.yml replaces this inert fragment only in DEV.
    include /etc/nginx/dev-web.conf;

    server {
        listen 80 default_server;
        server_name _;

        location = /proxy-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 80;
        server_name vk.neiirohub.ru dev-vk.neiirohub.ru;

        location = /webhooks/vk {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location = /health {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location = /billing/webhooks/yookassa {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "proto=https;host=$host";
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_set_header Connection "";
            proxy_pass http://provider_webhook;
        }

        location ^~ /payments/vk/ {
            access_log off;
            limit_req zone=payment_redirect_per_ip burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location ~ ^/(admin|metrics|debug|billing|readyz|healthz)(/|$) {
            return 404;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name neiirohub.ru dev.neiirohub.ru;

        location = /billing/webhooks/yookassa {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "proto=https;host=$host";
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_set_header Connection "";
            proxy_pass http://provider_webhook;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name app.neiirohub.ru dev-app.neiirohub.ru;

        # VK embeds the Mini App, so frame policy is expressed with CSP rather
        # than X-Frame-Options (which cannot represent the VK allowlist).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://*.userapi.com https://*.vkuserphoto.ru https://*.vk-cdn.net; media-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        location = /miniapp/artifacts {
            client_max_body_size 21m;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location ^~ /miniapp/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://api;
        }

        location ~ ^/(admin|metrics|debug|webhooks|billing|health|healthz|readyz)(/|$) {
            return 404;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_pass http://miniapp_frontend;
        }
    }
}
