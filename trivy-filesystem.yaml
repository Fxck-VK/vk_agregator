# Filesystem scans only. Release image scans must not use these exclusions.
scan:
  skip-dirs:
    - .runtime
    - .cache
    - node_modules
    - "**/node_modules"
    - web/platform/.next
    - web/admin/dist
    - coverage
    - web/platform/coverage
    - web/admin/coverage
    - web/platform/playwright-report
    - web/platform/test-results
    - references/magnific-html
    - references/magnific-html-js
    - references/magnific-login-ru
    - references/magnific-reference-assets
    - references/magnific-states
  skip-files:
    - "references/*.zip"
